      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#002b4d" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="112.64" fill="url(#bgGrad)"/>

  <!-- Emblem Group with Safe Zone Scaling -->
  <g transform="translate(40.96, 40.96) scale(4.3008)" filter="url(#dropGlow)">
    <!-- Stylized Tooth Path -->
    <path
