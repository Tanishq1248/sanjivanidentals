    />

    <!-- Clinical Cross / Sparkle Accent Top Right -->
    <g transform="translate(62, 20) scale(0.65)">
      <path
        d="M20 0 L23 15 L38 20 L23 25 L20 40 L17 25 L2 20 L17 15 Z"
